<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="tsBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>
    <radialGradient id="tsCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tsGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#tsBg)"/>
  <g stroke="#12304A" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <circle cx="600" cy="180" r="120" fill="url(#tsCore)"/>
  <circle cx="600" cy="180" r="30" fill="#0A1628" stroke="#00D4FF" stroke-width="1.6" filter="url(#tsGlow)">
    <animate attributeName="r" values="28;33;28" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="185" text-anchor="middle" fill="#E6F7FF" font-family="Consolas, monospace" font-size="11">CORE</text>

  <!-- helper macro for pill modules -->
  <!-- AI / ML layer (top-left arc) -->
  <g font-family="Consolas, monospace" font-size="12" fill="#E6F7FF">
    <!-- module template repeated manually -->
    <g>
      <line x1="600" y1="180" x2="230" y2="60" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="150" y="42" width="150" height="30" rx="15" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="225" y="62" text-anchor="middle">Python</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="230" y2="110" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="150" y="94" width="150" height="30" rx="15" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="225" y="114" text-anchor="middle">TensorFlow</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="230" y2="160" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="150" y="146" width="150" height="30" rx="15" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="225" y="166" text-anchor="middle">PyTorch</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="230" y2="210" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="150" y="196" width="150" height="30" rx="15" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="225" y="216" text-anchor="middle">Scikit-learn</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="230" y2="255" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="150" y="240" width="150" height="30" rx="15" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="225" y="260" text-anchor="middle">Pandas / NumPy</text>
    </g>
    <text x="225" y="30" text-anchor="middle" fill="#00D4FF" font-size="11" opacity="0.85">AI / ML</text>

    <!-- Web Development layer (top-right) -->
    <g>
      <line x1="600" y1="180" x2="970" y2="60" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="900" y="42" width="150" height="30" rx="15" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="975" y="62" text-anchor="middle">JavaScript</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="970" y2="110" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="900" y="94" width="150" height="30" rx="15" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="975" y="114" text-anchor="middle">React</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="970" y2="160" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="900" y="146" width="150" height="30" rx="15" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="975" y="166" text-anchor="middle">Node.js</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="970" y2="210" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="900" y="196" width="150" height="30" rx="15" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="975" y="216" text-anchor="middle">Flask</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="970" y2="255" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="900" y="240" width="150" height="30" rx="15" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="975" y="260" text-anchor="middle">FastAPI</text>
    </g>
    <text x="975" y="30" text-anchor="middle" fill="#00D4FF" font-size="11" opacity="0.85">WEB DEVELOPMENT</text>

    <!-- Database layer (bottom-left) -->
    <g>
      <line x1="600" y1="180" x2="330" y2="310" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="255" y="294" width="150" height="30" rx="15" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="330" y="314" text-anchor="middle">MongoDB</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="330" y2="345" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="255" y="330" width="150" height="26" rx="13" fill="#12304A" stroke="#00A8FF" stroke-width="1"/>
      <text x="330" y="348" text-anchor="middle" font-size="11">MySQL</text>
    </g>
    <text x="330" y="278" text-anchor="middle" fill="#00D4FF" font-size="11" opacity="0.85">DATABASE</text>

    <!-- Tools layer (bottom-right) -->
    <g>
      <line x1="600" y1="180" x2="870" y2="310" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="795" y="294" width="150" height="30" rx="15" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="870" y="314" text-anchor="middle">Git / GitHub</text>
    </g>
    <g>
      <line x1="600" y1="180" x2="870" y2="345" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
      <rect x="795" y="330" width="150" height="26" rx="13" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
      <text x="870" y="348" text-anchor="middle" font-size="11">Streamlit</text>
    </g>
    <text x="870" y="278" text-anchor="middle" fill="#00D4FF" font-size="11" opacity="0.85">TOOLS</text>
  </g>

  <!-- drifting particles for depth -->
  <g fill="#00D4FF" opacity="0.5">
    <circle cx="470" cy="70" r="2"><animate attributeName="cy" values="70;90;70" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="290" r="2"><animate attributeName="cy" values="290;270;290" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="60" r="2"><animate attributeName="cy" values="60;75;60" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
