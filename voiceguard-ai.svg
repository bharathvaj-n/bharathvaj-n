<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="vgBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12304A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="vgGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#vgBg)"/>
  <g stroke="#12304A" stroke-width="1" opacity="0.4">
    <line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
  </g>

  <!-- LEFT: abstract digital face silhouette -->
  <g transform="translate(90,55)" filter="url(#vgGlow)">
    <rect x="0" y="0" width="170" height="170" rx="10" fill="url(#panelFill)" stroke="#12304A"/>
    <path d="M85 30 C55 30 40 55 40 85 C40 120 60 145 85 150 C110 145 130 120 130 85 C130 55 115 30 85 30 Z"
          fill="none" stroke="#00A8FF" stroke-width="1.6" opacity="0.9"/>
    <g stroke="#00D4FF" stroke-width="1" opacity="0.6">
      <line x1="55" y1="70" x2="115" y2="70"/>
      <line x1="50" y1="90" x2="120" y2="90"/>
      <line x1="55" y1="110" x2="115" y2="110"/>
      <line x1="65" y1="130" x2="105" y2="130"/>
    </g>
    <circle cx="65" cy="75" r="2.5" fill="#00D4FF"/>
    <circle cx="105" cy="75" r="2.5" fill="#00D4FF"/>
    <text x="85" y="165" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="11">INPUT: FACE</text>
  </g>

  <!-- CENTER: neural detection engine -->
  <g transform="translate(500,45)" filter="url(#vgGlow)">
    <rect x="0" y="0" width="200" height="190" rx="10" fill="url(#panelFill)" stroke="#00A8FF" stroke-width="1.2"/>
    <circle cx="100" cy="85" r="34" fill="none" stroke="#00D4FF" stroke-width="1.6">
      <animate attributeName="r" values="30;38;30" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g fill="#00D4FF">
      <circle cx="55" cy="55" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="145" cy="55" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="55" cy="120" r="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="145" cy="120" r="3"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="35" r="3"/>
      <circle cx="100" cy="135" r="3"/>
    </g>
    <g stroke="#2563EB" stroke-width="1" opacity="0.7">
      <line x1="100" y1="85" x2="55" y2="55"/>
      <line x1="100" y1="85" x2="145" y2="55"/>
      <line x1="100" y1="85" x2="55" y2="120"/>
      <line x1="100" y1="85" x2="145" y2="120"/>
      <line x1="100" y1="85" x2="100" y2="35"/>
      <line x1="100" y1="85" x2="100" y2="135"/>
    </g>
    <text x="100" y="165" text-anchor="middle" fill="#E6F7FF" font-family="Consolas, monospace" font-size="12">DETECTION ENGINE</text>
    <text x="100" y="180" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="10">multimodal · deep learning</text>
  </g>

  <!-- RIGHT: waveform + video frame + verdict -->
  <g transform="translate(870,55)" filter="url(#vgGlow)">
    <rect x="0" y="0" width="230" height="170" rx="10" fill="url(#panelFill)" stroke="#12304A"/>
    <!-- video frame icon -->
    <rect x="16" y="14" width="70" height="46" rx="4" fill="none" stroke="#00A8FF" stroke-width="1.4"/>
    <polygon points="42,26 42,48 62,37" fill="#00D4FF" opacity="0.85"/>
    <!-- waveform -->
    <polyline points="16,90 28,80 40,100 52,70 64,105 76,85 88,95 100,75 112,100 124,88 136,92 148,80 160,95 172,86 184,90 196,82 208,90"
      fill="none" stroke="url(#waveGrad)" stroke-width="1.8"/>
    <!-- spectrogram bars -->
    <g fill="#2563EB" opacity="0.75">
      <rect x="16" y="118" width="4" height="14"/>
      <rect x="24" y="112" width="4" height="20"/>
      <rect x="32" y="120" width="4" height="12"/>
      <rect x="40" y="108" width="4" height="24"/>
      <rect x="48" y="116" width="4" height="16"/>
      <rect x="56" y="122" width="4" height="10"/>
      <rect x="64" y="110" width="4" height="22"/>
      <rect x="72" y="118" width="4" height="14"/>
    </g>
    <!-- verdict gauge -->
    <rect x="150" y="14" width="66" height="118" rx="8" fill="#0A1628" stroke="#12304A"/>
    <text x="183" y="35" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="9">VERDICT</text>
    <rect x="160" y="48" width="46" height="16" rx="3" fill="#12304A" stroke="#00D4FF" stroke-width="1"/>
    <text x="183" y="59" text-anchor="middle" fill="#00D4FF" font-family="Consolas, monospace" font-size="9">REAL</text>
    <rect x="160" y="72" width="46" height="16" rx="3" fill="#12304A" stroke="#2563EB" stroke-width="1" opacity="0.7"/>
    <text x="183" y="83" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="9">FAKE</text>
    <text x="115" y="155" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="10">audio · video signal</text>
  </g>

  <!-- connecting flow lines between the three panels -->
  <g stroke="#00A8FF" stroke-width="1.4" opacity="0.6">
    <line x1="260" y1="140" x2="500" y2="140"/>
    <line x1="700" y1="140" x2="870" y2="140"/>
  </g>
  <circle r="3" fill="#E6F7FF">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M260,140 L500,140"/>
  </circle>
  <circle r="3" fill="#E6F7FF">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M700,140 L870,140"/>
  </circle>

  <text x="600" y="270" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="12">
    VoiceGuard AI — multimodal deepfake detection
  </text>
</svg>
