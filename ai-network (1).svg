<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00A8FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12304A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="chipEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGlow)"/>

  <!-- subtle grid -->
  <g stroke="#12304A" stroke-width="1" opacity="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>

  <!-- ambient core glow behind chip -->
  <circle cx="600" cy="150" r="170" fill="url(#coreGlow)">
    <animate attributeName="r" values="160;180;160" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- long connector lines to distant nodes -->
  <g stroke="url(#lineFade)" stroke-width="1.5">
    <line x1="600" y1="150" x2="120" y2="60"/>
    <line x1="600" y1="150" x2="90" y2="220"/>
    <line x1="600" y1="150" x2="1090" y2="70"/>
    <line x1="600" y1="150" x2="1110" y2="230"/>
    <line x1="600" y1="150" x2="330" y2="255"/>
    <line x1="600" y1="150" x2="850" y2="255"/>
  </g>

  <!-- distant neural nodes -->
  <g fill="#00D4FF">
    <circle cx="120" cy="60" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="220" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="70" r="4"><animate attributeName="opacity" values="1;0.35;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="230" r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="255" r="3.5"/>
    <circle cx="850" cy="255" r="3.5"/>
  </g>

  <!-- floating isometric cubes -->
  <g opacity="0.85">
    <g transform="translate(175,110)">
      <polygon points="0,10 22,0 44,10 22,20" fill="#2563EB" opacity="0.55"/>
      <polygon points="0,10 22,20 22,42 0,32" fill="#12304A"/>
      <polygon points="44,10 22,20 22,42 44,32" fill="#0A1628"/>
      <animateTransform attributeName="transform" type="translate" values="175,110; 175,98; 175,110" dur="5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(985,190)">
      <polygon points="0,10 20,0 40,10 20,20" fill="#00A8FF" opacity="0.5"/>
      <polygon points="0,10 20,20 20,40 0,30" fill="#12304A"/>
      <polygon points="40,10 20,20 20,40 40,30" fill="#0A1628"/>
      <animateTransform attributeName="transform" type="translate" values="985,190; 985,178; 985,190" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- central 3D chip -->
  <g filter="url(#softGlow)">
    <polygon points="540,110 660,110 690,130 570,130" fill="url(#chipEdge)" opacity="0.9"/>
    <polygon points="540,110 570,130 570,190 540,170" fill="#0A1628"/>
    <rect x="540" y="130" width="150" height="90" rx="6" fill="url(#chipFace)" stroke="#00D4FF" stroke-width="1.4"/>
    <g stroke="#00A8FF" stroke-width="1" opacity="0.7">
      <line x1="555" y1="145" x2="595" y2="145"/>
      <line x1="555" y1="160" x2="675" y2="160"/>
      <line x1="555" y1="175" x2="640" y2="175"/>
      <line x1="555" y1="190" x2="675" y2="190"/>
      <line x1="555" y1="205" x2="610" y2="205"/>
    </g>
    <circle cx="615" cy="175" r="14" fill="none" stroke="#00D4FF" stroke-width="1.6">
      <animate attributeName="r" values="12;16;12" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="615" cy="175" r="4" fill="#00D4FF"/>
    <g stroke="#00A8FF" stroke-width="2">
      <line x1="540" y1="145" x2="520" y2="145"/>
      <line x1="540" y1="165" x2="520" y2="165"/>
      <line x1="540" y1="185" x2="520" y2="185"/>
      <line x1="540" y1="205" x2="520" y2="205"/>
      <line x1="690" y1="150" x2="710" y2="150"/>
      <line x1="690" y1="170" x2="710" y2="170"/>
      <line x1="690" y1="190" x2="710" y2="190"/>
    </g>
  </g>

  <!-- data particles flowing along lines -->
  <circle r="3" fill="#E6F7FF">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M600,150 L120,60"/>
  </circle>
  <circle r="3" fill="#E6F7FF">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M600,150 L1090,70"/>
  </circle>
  <circle r="2.5" fill="#E6F7FF">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M600,150 L90,220"/>
  </circle>

  <!-- floating AI / dev glyphs -->
  <g fill="#8BA3B7" font-family="Consolas, monospace" font-size="14" opacity="0.8">
    <text x="150" y="255">Python</text>
    <text x="960" y="100">ML</text>
    <text x="270" y="90">AI</text>
    <text x="890" y="245">Data</text>
  </g>
</svg>
