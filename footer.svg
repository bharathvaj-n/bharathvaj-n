<svg width="1200" height="140" viewBox="0 0 1200 140" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="ftBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>
    <linearGradient id="ftLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="url(#ftBg)"/>
  <g stroke="#12304A" stroke-width="1" opacity="0.35">
    <line x1="0" y1="20" x2="1200" y2="20"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
  </g>

  <!-- flowing neural lines -->
  <path d="M0,70 C200,30 300,110 500,70 C700,30 800,110 1000,70 C1100,50 1150,80 1200,70"
        fill="none" stroke="url(#ftLine)" stroke-width="1.4">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <g fill="#00D4FF" opacity="0.85">
    <circle cx="140" cy="45" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="95" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="45" r="2.5"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="95" r="2.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="50" r="2.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="66" text-anchor="middle" fill="#E6F7FF" font-family="Consolas, monospace" font-size="17" letter-spacing="0.5">
    Building intelligent solutions, one model at a time.
  </text>
  <text x="600" y="90" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="11">
    thanks for visiting
  </text>
</svg>
