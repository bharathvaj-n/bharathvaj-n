<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="blockTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" fill="url(#cfBg)"/>
  <g stroke="#12304A" stroke-width="1" opacity="0.4">
    <line x1="0" y1="10" x2="1200" y2="10"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
  </g>

  <!-- isometric block field, echoing a contribution grid -->
  <g>
    <!--
      A row of small isometric cubes with varying opacity to suggest
      a "heatmap" of activity, purely decorative — no real data encoded.
    -->
  </g>

  <g id="row" transform="translate(40,60)">
    <!-- 24 isometric blocks, alternating heights/opacities for a data-landscape feel -->
    <g id="blocks" fill="none">
      <!-- generated block group -->
    </g>
  </g>

  <!-- hand-placed isometric blocks -->
  <g transform="translate(40,70)">
    <g transform="translate(0,0)"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,34 0,24" fill="#12304A"/><polygon points="36,10 18,20 18,34 36,24" fill="#0A1628"/></g>
    <g transform="translate(44,-6)" opacity="0.7"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,26 0,16" fill="#12304A"/><polygon points="36,10 18,20 18,26 36,16" fill="#0A1628"/></g>
    <g transform="translate(88,4)" opacity="0.9"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,40 0,30" fill="#12304A"/><polygon points="36,10 18,20 18,40 36,30" fill="#0A1628"/></g>
    <g transform="translate(132,-10)" opacity="0.5"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,24 0,14" fill="#12304A"/><polygon points="36,10 18,20 18,24 36,14" fill="#0A1628"/></g>
    <g transform="translate(176,8)" opacity="0.95"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,44 0,34" fill="#12304A"/><polygon points="36,10 18,20 18,44 36,34" fill="#0A1628"/></g>
    <g transform="translate(220,-4)" opacity="0.6"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,30 0,20" fill="#12304A"/><polygon points="36,10 18,20 18,30 36,20" fill="#0A1628"/></g>
    <g transform="translate(264,2)" opacity="0.8"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,36 0,26" fill="#12304A"/><polygon points="36,10 18,20 18,36 36,26" fill="#0A1628"/></g>
    <g transform="translate(308,-8)" opacity="0.5"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,26 0,16" fill="#12304A"/><polygon points="36,10 18,20 18,26 36,16" fill="#0A1628"/></g>
  </g>

  <g transform="translate(600,70)">
    <g transform="translate(0,4)" opacity="0.9"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,40 0,30" fill="#12304A"/><polygon points="36,10 18,20 18,40 36,30" fill="#0A1628"/></g>
    <g transform="translate(44,-8)" opacity="0.55"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,26 0,16" fill="#12304A"/><polygon points="36,10 18,20 18,26 36,16" fill="#0A1628"/></g>
    <g transform="translate(88,6)" opacity="0.95"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,44 0,34" fill="#12304A"/><polygon points="36,10 18,20 18,44 36,34" fill="#0A1628"/></g>
    <g transform="translate(132,-4)" opacity="0.65"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,30 0,20" fill="#12304A"/><polygon points="36,10 18,20 18,30 36,20" fill="#0A1628"/></g>
    <g transform="translate(176,0)" opacity="0.8"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,36 0,26" fill="#12304A"/><polygon points="36,10 18,20 18,36 36,26" fill="#0A1628"/></g>
    <g transform="translate(220,-10)" opacity="0.5"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,24 0,14" fill="#12304A"/><polygon points="36,10 18,20 18,24 36,14" fill="#0A1628"/></g>
    <g transform="translate(264,4)" opacity="0.9"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,40 0,30" fill="#12304A"/><polygon points="36,10 18,20 18,40 36,30" fill="#0A1628"/></g>
    <g transform="translate(308,-6)" opacity="0.6"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,28 0,18" fill="#12304A"/><polygon points="36,10 18,20 18,28 36,18" fill="#0A1628"/></g>
    <g transform="translate(352,2)" opacity="0.85"><polygon points="0,10 18,0 36,10 18,20" fill="url(#blockTop)"/><polygon points="0,10 18,20 18,36 0,26" fill="#12304A"/><polygon points="36,10 18,20 18,36 36,26" fill="#0A1628"/></g>
  </g>

  <!-- floating data particles for depth -->
  <g fill="#00D4FF" opacity="0.7">
    <circle cx="130" cy="30" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="130" r="2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="35" r="2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="145" text-anchor="middle" fill="#8BA3B7" font-family="Consolas, monospace" font-size="10" opacity="0.7">
    decorative atmosphere — real contribution data renders below
  </text>
</svg>
