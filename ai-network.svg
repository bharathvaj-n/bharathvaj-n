<svg width="900" height="160" viewBox="0 0 900 160" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64FFDA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64FFDA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="160" fill="#0A0E14"/>

  <!-- background grid -->
  <g stroke="#1B2430" stroke-width="1">
    <line x1="0" y1="20" x2="900" y2="20"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="75" y1="0" x2="75" y2="160"/>
    <line x1="225" y1="0" x2="225" y2="160"/>
    <line x1="375" y1="0" x2="375" y2="160"/>
    <line x1="525" y1="0" x2="525" y2="160"/>
    <line x1="675" y1="0" x2="675" y2="160"/>
    <line x1="825" y1="0" x2="825" y2="160"/>
  </g>

  <!-- network connections -->
  <g stroke="url(#lineGrad)" stroke-width="1.4" fill="none">
    <path d="M60,90 L180,40 L320,110 L460,50 L600,120 L740,45 L840,90">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M60,90 L180,40" stroke-dasharray="4 4"/>
    <path d="M320,110 L460,50" stroke-dasharray="4 4"/>
    <path d="M180,40 L320,110" stroke-dasharray="4 4"/>
    <path d="M460,50 L600,120" stroke-dasharray="4 4"/>
    <path d="M600,120 L740,45" stroke-dasharray="4 4"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="60" cy="90" r="14" fill="url(#nodeGlow)"/>
    <circle cx="60" cy="90" r="3.5" fill="#64FFDA"/>

    <circle cx="180" cy="40" r="14" fill="url(#nodeGlow)"/>
    <circle cx="180" cy="40" r="3.5" fill="#64FFDA">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="110" r="16" fill="url(#nodeGlow)"/>
    <circle cx="320" cy="110" r="4" fill="#64FFDA"/>

    <circle cx="460" cy="50" r="14" fill="url(#nodeGlow)"/>
    <circle cx="460" cy="50" r="3.5" fill="#64FFDA">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="120" r="16" fill="url(#nodeGlow)"/>
    <circle cx="600" cy="120" r="4" fill="#64FFDA"/>

    <circle cx="740" cy="45" r="14" fill="url(#nodeGlow)"/>
    <circle cx="740" cy="45" r="3.5" fill="#64FFDA">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="840" cy="90" r="14" fill="url(#nodeGlow)"/>
    <circle cx="840" cy="90" r="3.5" fill="#64FFDA"/>
  </g>

  <!-- floating AI glyphs -->
  <g fill="#64FFDA" opacity="0.55" font-family="Consolas, monospace" font-size="13">
    <text x="130" y="130">&lt;/&gt;</text>
    <text x="380" y="35">{ }</text>
    <text x="520" y="140">01</text>
    <text x="680" y="100">λ</text>
  </g>
</svg>
